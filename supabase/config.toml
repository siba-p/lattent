project_id = "lattent"

[auth]
site_url = "https://siba-p.github.io/lattent/"
additional_redirect_urls = ["https://siba-p.github.io/lattent/**", "http://127.0.0.1:8765/**", "http://localhost:8000/**"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
otp_expiry = 3600
max_frequency = "60s"

[auth.rate_limit]
email_sent = 30

[functions.ls-webhook]
verify_jwt = false

[functions.delete-account]
verify_jwt = true
