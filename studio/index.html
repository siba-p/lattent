<div class="st-body">
  <aside class="st-side">
    <button class="btn primary newbtn" id="st-addtable">+ New data table</button>
    <h5>Project</h5>
    <nav id="st-nav" aria-label="Tables and analyses"></nav>
    <h5 class="disc-h">Discover <span class="new-badge">New</span></h5>
    <nav class="disc" aria-label="Discover">
      <button class="nv-row" data-disc="search"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.5l5.5 3.2v6.6L8 14.5l-5.5-3.2V4.7z M2.5 4.7L8 8l5.5-3.3M8 8v6.5" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg><span class="nm">Materials database</span></button>
      <button class="nv-row" data-disc="phase"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M1.5 14h13M3 14V12M5.5 14V4M8 14V9M10.5 14V6.5M13 14v-3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg><span class="nm">Identify XRD phases</span></button>
      <button class="nv-row" data-disc="gen"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M7 1.5l1.3 3.6 3.7 1.2-3.7 1.2L7 11.1 5.7 7.5 2 6.3l3.7-1.2zM12.5 10l.6 1.5 1.4.5-1.4.5-.6 1.5-.6-1.5-1.4-.5 1.4-.5z" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg><span class="nm">Generate materials</span></button>
    </nav>
    <div class="foot-links"><a href="../">About Lattent</a><a href="../validation/">Validation</a><a href="../#pricing">Pricing</a></div>
  </aside>
  <main class="st-main" id="st-main"></main>
</div>
<aside class="co" aria-label="Co-scientist">
  <div class="co-head"><h3>Co-scientist</h3><button class="x" id="co-close" aria-label="Close">×</button></div>
  <div class="co-tabs" role="tablist"><button id="co-tab-advisor" aria-selected="true">Suggestions</button><button id="co-tab-chat" aria-selected="false">Ask Claude or GPT</button></div>
  <div id="co-advisor"></div>
  <div id="co-chat" hidden>
    <div class="co-cfg">
      <div class="row"><select id="ai-provider" aria-label="Provider"><option value="anthropic">Anthropic</option><option value="openai">OpenAI</option></select><input id="ai-model" aria-label="Model"></div>
      <div class="row"><input id="ai-key" type="password" placeholder="Your API key" autocomplete="off" aria-label="API key"><button class="btn small ghost" id="ai-forget">Forget</button></div>
      <span id="ai-state"></span>
    </div>
    <div id="co-log"></div>
    <form id="co-form"><textarea id="co-q" placeholder="Ask about your data…" aria-label="Question"></textarea><button class="btn primary" type="submit">Ask</button></form>
  </div>
</aside>
