<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Benchfit Studio: analyse, graph and explain your data</title>
<meta name="description" content="A browser workspace for scientific data: curve fitting with 35 equations, statistics, spectra and XRD peak analysis, band gaps, tensile tests, PCA, clustering and Bayesian optimisation, with an AI co-scientist.">
<link rel="icon" href="../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700&family=JetBrains+Mono:wght@400;500&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/bf.css">
<link rel="stylesheet" href="../assets/css/studio.css">
</head>
<body class="studio">
<div class="st-top">
  <button class="btn ghost" id="st-menu" aria-label="Show navigator">☰</button>
  <a class="logo" href="../"><svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="var(--brand)"/><path d="M6 23c5 0 6-14 10-14s5 14 10 14" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/><circle cx="16" cy="9" r="2.4" fill="#fff"/></svg><span>Benchfit</span><small>Studio</small></a>
  <input id="st-name" aria-label="Project name" value="Untitled project">
  <span class="sp"></span>
  <div class="tb">
    <button class="btn ghost hide-sm" id="st-new">New</button>
    <button class="btn ghost hide-sm" id="st-open">Open</button>
    <button class="btn ghost hide-sm" id="st-save">Save <span class="lock">PRO</span></button>
    <button class="btn" id="st-co"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M10 2.5l1.6 4.2 4.4 1.3-4.4 1.3L10 13.5 8.4 9.3 4 8l4.4-1.3z"/><path d="M15.5 13l.7 1.8 1.8.7-1.8.7-.7 1.8-.7-1.8-1.8-.7 1.8-.7z"/></svg><span class="lbl-co">Co-scientist</span></button>
    <a class="pro-chip" href="../account/" id="pro-chip"></a>
  </div>
</div>
<div class="st-body">
  <aside class="st-side">
    <button class="btn primary newbtn" id="st-addtable">+ New data table</button>
    <h5>Project</h5>
    <nav id="st-nav" aria-label="Tables and analyses"></nav>
    <div class="foot-links"><a href="../">About Benchfit</a><a href="../validation/">Validation</a><a href="../#pricing">Pricing</a></div>
  </aside>
  <main class="st-main" id="st-main"></main>
</div>
<aside class="co" aria-label="Co-scientist">
  <div class="co-head"><h3>Co-scientist</h3><button class="x" id="co-close" aria-label="Close">×</button></div>
  <div class="co-tabs" role="tablist"><button id="co-tab-advisor" aria-selected="true">Suggestions</button><button id="co-tab-chat" aria-selected="false">Ask Claude or GPT</button></div>
  <div id="co-advisor"></div>
  <div id="co-chat" hidden>
    <div class="co-cfg">
      <div class="row"><select id="ai-provider" aria-label="Provider"><option value="anthropic">Anthropic</option><option value="openai">OpenAI</option></select><input id="ai-model" aria-label="Model"></div>
      <div class="row"><input id="ai-key" type="password" placeholder="Your API key" autocomplete="off" aria-label="API key"><button class="btn small ghost" id="ai-forget">Forget</button></div>
      <span id="ai-state"></span>
    </div>
    <div id="co-log"></div>
    <form id="co-form"><textarea id="co-q" placeholder="Ask about your data…" aria-label="Question"></textarea><button class="btn primary" type="submit">Ask</button></form>
  </div>
</aside>
<script src="../assets/js/config.js"></script>
<script src="../assets/js/stats.js"></script>
<script src="../assets/js/models.js"></script>
<script src="../assets/js/analysis.js"></script>
<script src="../assets/js/plot.js"></script>
<script src="../assets/js/shell.js"></script>
<script src="../assets/js/samples.js"></script>
<script src="../assets/js/studio.js"></script>
</body>
</html>
